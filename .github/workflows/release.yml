name: Release

# Push a tag matching mod_version in gradle.properties (v0.2.0, or v0.2.0-beta.1 for a beta) to build and test
# every subproject, attach the jars to a GitHub release, and upload each one to CurseForge.
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches mod_version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$version in gradle.properties"
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/build.yml

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" jars/*.jar --title "Forevercraft ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag $prerelease

  curseforge:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.build.outputs.projects) }}
    name: curseforge (${{ matrix.project }})
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: jars
      - name: Read loader and Minecraft version
        id: props
        run: |
          props=${{ matrix.project }}/gradle.properties
          loader=$(sed -n 's/^loader=//p' "$props")
          {
            echo "loader=$loader"
            echo "minecraft=$(sed -n 's/^minecraft_version=//p' "$props")"
            echo "java=$(sed -n 's/^java_version=//p' "$props")"
            case "$loader" in neoforge) echo "loader_name=NeoForge" ;; forge) echo "loader_name=Forge" ;; *) echo "loader_name=$loader" ;; esac
            case "$GITHUB_REF_NAME" in *-alpha*) echo "type=alpha" ;; *-*) echo "type=beta" ;; *) echo "type=release" ;; esac
          } >> "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --json body --jq .body > changelog.md
      - name: Skip without a token
        if: env.CURSEFORGE_TOKEN == ''
        run: echo "::warning::CURSEFORGE_TOKEN is not set; skipping the CurseForge upload for ${{ matrix.project }}"
      - uses: Kir-Antipov/mc-publish@v3.3
        if: env.CURSEFORGE_TOKEN != ''
        with:
          curseforge-id: 1827987
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: jars/*.jar
          name: Forevercraft ${{ github.ref_name }} (${{ steps.props.outputs.loader_name }} ${{ steps.props.outputs.minecraft }})
          version: ${{ github.ref_name }}+${{ steps.props.outputs.loader }}-${{ steps.props.outputs.minecraft }}
          version-type: ${{ steps.props.outputs.type }}
          changelog-file: changelog.md
          loaders: ${{ steps.props.outputs.loader }}
          game-versions: ${{ steps.props.outputs.minecraft }}
          java: ${{ steps.props.outputs.java }}

