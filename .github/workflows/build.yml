name: Build

# Builds every loader/version subproject listed in settings.gradle, runs its unit tests and GameTests, and keeps
# the jars as artifacts. release.yml reuses this, so a tag only publishes what passed here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      projects:
        description: JSON list of the subprojects that were built
        value: ${{ jobs.versions.outputs.projects }}

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          projects=$(sed -n "s/^include '\(.*\)'$/\1/p" settings.gradle | jq -Rnc '[inputs]')
          echo "Subprojects: $projects"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.versions.outputs.projects) }}
    name: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit test
        run: ./gradlew --console=plain :${{ matrix.project }}:build
      - name: GameTests
        run: ./gradlew --console=plain :${{ matrix.project }}:runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
